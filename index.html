<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangkwa&amp;Nut Wedding · ค้นหาโต๊ะ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#fbf7f2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap">
<style>
:root{
  --cream:#fbf7f2; --paper:#fffdf9; --wine:#8e1f1d; --wine-soft:#f4e6e3;
  --navy:#222c52; --text:#2a2423; --muted:#8a7d76; --line:#e8ddd0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--text);font-family:"Noto Sans Thai",system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -10%,#fff 0,rgba(255,255,255,0) 60%)}
.frame{max-width:560px;margin:0 auto;padding:34px 18px 28px}

/* hero */
.hero{text-align:center}
.hero img{width:128px;height:auto;display:block;margin:0 auto 10px}
.names{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.5rem;line-height:1.05;margin:0;color:var(--wine);letter-spacing:.5px}
.names i{font-weight:500;font-style:italic;padding:0 .08em}
.wedding{font-family:"Cormorant Garamond",Georgia,serif;font-size:.95rem;letter-spacing:.5em;text-transform:uppercase;color:var(--navy);margin:8px 0 0;padding-left:.5em}
.orn{display:flex;align-items:center;gap:12px;margin:22px auto 18px;max-width:280px;color:var(--wine)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--wine));opacity:.5}
.orn::after{background:linear-gradient(270deg,transparent,var(--wine))}
.orn span{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--wine)}
.lead{font-family:"Noto Serif Thai",serif;font-weight:500;font-size:1.2rem;margin:0;color:var(--text)}
.lead small{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.05rem;color:var(--muted);margin-top:2px}

/* search */
.search{margin-top:22px;position:relative}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--wine);fill:none;stroke-width:1.6}
input[type=search]{width:100%;font:inherit;font-size:1.1rem;padding:16px 20px 16px 50px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--text);
  box-shadow:0 6px 24px rgba(142,31,29,.06);-webkit-appearance:none;appearance:none}
input[type=search]::placeholder{color:#b3a79f}
input[type=search]:focus{outline:none;border-color:var(--wine);box-shadow:0 0 0 4px rgba(142,31,29,.1)}

/* results */
#results{margin-top:20px;display:grid;gap:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
  box-shadow:0 2px 10px rgba(60,30,20,.04);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.item{animation:none}}
.nm{font-family:"Noto Serif Thai",serif;font-weight:600;font-size:1.08rem;line-height:1.35}
.nk{color:var(--muted);font-size:.92rem;margin-top:3px}
.nk b{font-weight:500;color:var(--wine)}
.tn{margin-top:9px;display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-size:.82rem;font-weight:500;letter-spacing:.2px;border:1px solid rgba(34,44,82,.25);border-radius:999px;padding:3px 12px;background:rgba(34,44,82,.04)}
.tn::before{content:"";width:5px;height:5px;transform:rotate(45deg);background:var(--navy)}
.tb{flex:none;width:86px;height:86px;border-radius:50%;border:1.5px solid var(--wine);outline:1px solid var(--wine);outline-offset:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--wine);background:var(--wine-soft);margin:5px}
.tb small{font-family:"Cormorant Garamond",serif;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;padding-left:.25em}
.tb b{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:2.2rem;line-height:1}
.tb b.long{font-size:1.3rem}
.msg{text-align:center;color:var(--muted);padding:26px 8px;font-size:.98rem}

footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
footer em{font-family:"Cormorant Garamond",serif;font-size:1rem;color:var(--wine)}
</style>
</head>
<body>
<div class="frame">
  <div class="hero">
    <img src="logo.png" alt="โลโก้ C&amp;N">
    <h1 class="names">Tangkwa<i>&amp;</i>Nut</h1>
    <p class="wedding">Wedding</p>
    <div class="orn"><span></span></div>
    <p class="lead">ค้นหาโต๊ะของคุณ<small>Find your seat</small></p>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
    <input type="search" id="q" placeholder="พิมพ์ชื่อ นามสกุล หรือชื่อเล่น" autocomplete="off" aria-label="ค้นหาชื่อแขก">
  </div>
  <div id="results"><div class="msg">กำลังโหลดรายชื่อ...</div></div>

  <footer>ไม่พบชื่อของคุณ? สอบถามเจ้าหน้าที่ที่โต๊ะลงทะเบียนได้เลยค่ะ<br><em>With love, Tangkwa &amp; Nut</em></footer>
</div>
<script>
let guests=[];
const q=document.getElementById("q"),out=document.getElementById("results");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
const m=location.hostname.match(/^(.+)\.github\.io$/),seg=location.pathname.split("/")[1];
async function load(){
  try{
    if(!m||!seg||seg.endsWith(".html"))throw 0;
    const r=await fetch(`https://api.github.com/repos/${m[1]}/${seg}/contents/guests.json`,{headers:{Accept:"application/vnd.github.raw+json"}});
    if(!r.ok)throw 0;
    return await r.json();
  }catch(e){return await (await fetch("guests.json?v="+Date.now())).json()}
}
load().then(d=>{guests=Array.isArray(d)?d:[];render()}).catch(()=>{out.innerHTML='<div class="msg">โหลดรายชื่อไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>'});
function render(){
  const v=norm(q.value);
  if(!v){out.innerHTML='<div class="msg">พิมพ์ชื่อเพื่อค้นหาที่นั่งของคุณ</div>';return}
  const hits=guests.filter(g=>norm([g.name,g.nick,g.nickEn].join(" ")).includes(v)).slice(0,30);
  if(!hits.length){out.innerHTML='<div class="msg">ไม่พบรายชื่อ ลองพิมพ์ส่วนอื่นของชื่อ</div>';return}
  out.innerHTML=hits.map(g=>{
    const nicks=[g.nick,g.nickEn].filter(Boolean).map(esc).join(" · ");
    const t=String(g.table==null?"":g.table);
    return `<div class="item"><div><div class="nm">${esc(g.name)}</div>${nicks?`<div class="nk">${nicks}</div>`:""}${g.tableName?`<span class="tn">${esc(g.tableName)}</span>`:""}</div><div class="tb"><small>Table</small><b${t.length>3?' class="long"':""}>${esc(t)}</b></div></div>`}).join("");
}
q.addEventListener("input",render);
</script>
</body>
</html>
